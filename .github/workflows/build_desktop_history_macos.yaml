name: Build Element Desktop ARM64

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: macos-26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
              with:
                  node-version-file: .node-version
                  cache: true
                  install: false
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter element-web build
            - run: pnpm vitest run --project 'element-web (unit)' apps/web/src/utils/DesktopHistory.test.ts
            - name: Package the modified Web client
              working-directory: apps/desktop
              run: |
                  cp -R ../web/webapp webapp
                  cp element.io/release/config.json webapp/config.json
                  pnpm run asar-webapp
            - name: Install Quartz for DMG artwork
              run: sudo pip3 install --break-system-packages pyobjc-framework-Quartz
            - name: Build macOS ARM64 app
              working-directory: apps/desktop
              run: pnpm run build --mac dmg zip --arm64 --publish never
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: element-desktop-macos-arm64
                  path: |
                      apps/desktop/dist/*.dmg
                      apps/desktop/dist/*.zip
                  if-no-files-found: error
