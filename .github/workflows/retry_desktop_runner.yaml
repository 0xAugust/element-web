name: Retry unavailable macOS runner

on:
    workflow_run:
        workflows: [Build Element Desktop ARM64]
        branches: [develop]
        types: [completed]

permissions: {}

jobs:
    retry:
        if: >-
            github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.run_attempt < 3
        runs-on: ubuntu-latest
        permissions:
            actions: write
            checks: read
        steps:
            - name: Retry only a hosted runner acquisition failure
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.event.workflow_run.id }}
                  RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
              run: |
                  api="repos/$GH_REPO/actions/runs/$RUN_ID"
                  job_id=$(gh api "$api/attempts/$RUN_ATTEMPT/jobs" --jq '
                      .jobs[]
                      | select(.name == "build" and .conclusion == "cancelled" and (.steps | length) == 0)
                      | .id
                  ')
                  if [[ -z "$job_id" ]]; then
                      echo "No unstarted macOS build job to retry."
                      exit 0
                  fi

                  runner_error=$(gh api "repos/$GH_REPO/check-runs/$job_id/annotations" --paginate --jq '
                      .[] | select(.message == "The job was not acquired by Runner of type hosted even after multiple attempts") | .message
                  ')
                  if [[ -z "$runner_error" ]]; then
                      echo "The build did not report a hosted runner acquisition failure."
                      exit 0
                  fi

                  current=$(gh api "$api" --jq '"\(.run_attempt):\(.status):\(.conclusion)"')
                  if [[ "$current" != "$RUN_ATTEMPT:completed:failure" ]]; then
                      echo "The run has already changed."
                      exit 0
                  fi
                  gh api --method POST "repos/$GH_REPO/actions/jobs/$job_id/rerun"
                  echo "Queued retry $RUN_ATTEMPT of 2 for the macOS build job."
